<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoopMaster SA3 — Grid Generator</title>
    <meta name="description" content="Multi-track audio variant generator with synchronized grid playback.">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="app-logo">
                <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
            </div>
            <h1 class="app-title">LoopMaster SA3 <span>Grid Generator</span></h1>
        </header>

        <!-- Controls -->
        <section class="controls-panel" id="controls-panel">
            <div class="controls-row">
                <div class="control-group prompt-group">
                    <div class="prompt-header-row">
                        <label class="control-label" for="prompt-input">Prompt</label>
                        <div class="prompt-inline-btns">
                            <button class="prompt-pill-btn" id="btn-random-in-key" type="button" title="Generate Random Prompt in Current Key/Chord"><svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3M15.5 7.5L14 9"/></svg>In Key</button>
                            <button class="prompt-pill-btn" id="btn-random-prompt" type="button" title="Generate Random Instrument Prompt"><svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M7.5 7.5h.01M16.5 7.5h.01M7.5 16.5h.01M16.5 16.5h.01M12 12h.01"/></svg>Random</button>
                            <button class="prompt-pill-btn" id="btn-change-chord" type="button" title="Change Key/Chord only in current prompt"><svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Chord</button>
                            <button class="prompt-pill-btn" id="btn-change-style" type="button" title="Change Style/Genre only in current prompt"><svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Style</button>
                            <button class="prompt-pill-btn" id="btn-change-instrument" type="button" title="Change Instrument only in current prompt"><svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><path d="M12 2v20M17 5v14M22 9v6M7 8v8M2 10v4"/></svg>Inst</button>
                            <button class="prompt-pill-btn" id="btn-random-drums" type="button" title="Generate Random Drum Loop Prompt"><svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v10c0 1.66 4 3 9 3s9-1.34 9-3V5M7 17v4M17 17v4"/></svg>Drums</button>
                            <button class="prompt-pill-btn" id="btn-random-bass" type="button" title="Generate Random Bass Prompt"><svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><path d="M2 10h3l2.5-6 3 16 2.5-14 3 10 1.5-6h4.5"/></svg>Bass</button>
                            <button class="prompt-pill-btn" id="btn-random-lead" type="button" title="Generate Random Lead Prompt"><svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M6 3v12M10 3v12M14 3v12M18 3v12M2 15h20"/></svg>Lead</button>
                        </div>
                    </div>
                    <input class="control-input" id="prompt-input" type="text"
                           placeholder="bass synth loop, funky, hyperpop…"
                           autocomplete="off" spellcheck="false">
                </div>

                <div class="control-group">
                    <label class="control-label" for="bpm-input" title="Tempo in beats per minute. Determines loop length (4 bars). Drag to change, double-click to type.">BPM</label>
                    <input class="control-input" id="bpm-input" type="number"
                           min="40" max="300" value="120" step="1"
                           title="Click to type, drag ↕ to change. 120 BPM = 8s loop (4 bars)">
                </div>

                <div class="control-group">
                    <label class="control-label" for="seed-input" title="Random seed for reproducible generations. -1 = random each time. Set a number to get the same output.">Seed</label>
                    <input class="control-input control-input-sm" id="seed-input" type="number"
                           min="-1" max="999999" value="-1" step="1"
                           title="Click to type, drag ↕ to change. -1 = random">
                </div>


                <div class="control-group">
                    <label class="control-label" for="steps-input" title="Diffusion denoising passes. 8 = fast iteration, 20-30 = high quality, 50+ = diminishing returns.">Steps</label>
                    <input class="control-input control-input-sm" id="steps-input" type="number"
                           min="1" max="100" value="8" step="1"
                           title="Click to type, drag ↕ to change. More = better but slower">
                </div>

                <div class="control-group">
                    <button class="btn-generate" id="btn-generate" type="button">Generate</button>
                </div>
            </div>

            <div class="status-bar" id="status-bar">
                <div class="status-spinner"></div>
                <span class="status-text" id="status-text">Generating…</span>
            </div>

            <!-- Init Audio Badge -->
            <div class="init-audio-badge" id="init-audio-badge" style="display: none; flex-direction: column; align-items: stretch; gap: 8px;">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;">
                    <span style="font-size: 0.75rem; font-weight: 500; display: flex; align-items: center; gap: 4px;">
                        <svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="display: inline-block; vertical-align: middle;"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z"/></svg>
                        Remixing: <strong id="init-audio-name">None</strong>
                    </span>
                    <button class="btn-clear-init" id="btn-clear-init" type="button" title="Clear Init Audio">×</button>
                </div>
                <div class="remix-mode-selector" style="display: flex; gap: 4px; background: rgba(255,255,255,0.03); padding: 2px; border-radius: 4px; border: 1px solid var(--border-input); padding: 2px;">
                    <button class="remix-mode-btn active" data-mode="variation" type="button">Variation</button>
                    <button class="remix-mode-btn" data-mode="response" type="button">Response</button>
                    <button class="remix-mode-btn" data-mode="inpaint" type="button">Inpaint</button>
                    <button class="remix-mode-btn" data-mode="continuation" type="button">Continuation</button>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                    <label class="toggle-switch" title="Reverse the seed audio timing and progression before generating" style="font-size: 0.7rem; display: flex; align-items: center; gap: 6px;">
                        <input type="checkbox" id="toggle-invert-timing">
                        <span class="toggle-track"></span>Invert Timing
                    </label>
                </div>
                <!-- Variation parameters -->
                <div id="remix-params-variation" class="remix-params-subpanel">
                    <div class="init-noise-control" style="display: flex; align-items: center; gap: 8px; width: 100%;">
                        <label for="init-noise-slider" style="font-size: 0.7rem; width: 75px; text-align: left;">Noise Level:</label>
                        <input type="range" id="init-noise-slider" min="10" max="90" value="60" step="5" style="flex: 1;">
                        <span id="init-noise-value" style="font-size: 0.7rem; width: 35px; text-align: right; font-family: monospace;">0.60</span>
                    </div>
                </div>
                <!-- Inpaint parameters -->
                <div id="remix-params-inpaint" class="remix-params-subpanel" style="display: none; flex-direction: column; gap: 6px;">
                    <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                        <label for="inpaint-start-slider" style="font-size: 0.7rem; width: 75px; text-align: left;">Inpaint Start:</label>
                        <input type="range" id="inpaint-start-slider" min="0" max="80" value="20" step="1" style="flex: 1;">
                        <span id="inpaint-start-val" style="font-size: 0.7rem; width: 35px; text-align: right; font-family: monospace;">2.0s</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                        <label for="inpaint-end-slider" style="font-size: 0.7rem; width: 75px; text-align: left;">Inpaint End:</label>
                        <input type="range" id="inpaint-end-slider" min="0" max="80" value="60" step="1" style="flex: 1;">
                        <span id="inpaint-end-val" style="font-size: 0.7rem; width: 35px; text-align: right; font-family: monospace;">6.0s</span>
                    </div>
                </div>
                <!-- Continuation parameters -->
                <div id="remix-params-continuation" class="remix-params-subpanel" style="display: none;">
                    <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                        <label for="continue-start-slider" style="font-size: 0.7rem; width: 75px; text-align: left;">Keep First:</label>
                        <input type="range" id="continue-start-slider" min="0" max="80" value="40" step="1" style="flex: 1;">
                        <span id="continue-start-val" style="font-size: 0.7rem; width: 35px; text-align: right; font-family: monospace;">4.0s</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Transport Panel -->
        <div class="transport-panel">
            <div class="transport-bar" id="transport-bar">
                <button class="btn-transport" id="btn-play-pause" type="button" disabled aria-label="Play">
                    <svg class="ic ic-play" viewBox="0 0 16 16"><path d="M4 2.5l9 5.5-9 5.5z"/></svg>
                    <svg class="ic ic-pause" viewBox="0 0 16 16"><rect x="3.5" y="2" width="3" height="12" rx="0.5"/><rect x="9.5" y="2" width="3" height="12" rx="0.5"/></svg>
                </button>
                <span class="transport-time">
                    <span id="t-position">0:00.0</span> / <span id="t-duration">0:00.0</span>
                </span>
                
                <!-- Master Meter & Limiter Section -->
                <div class="master-meter-section" id="master-meter-section" style="display: none;">
                    <span class="master-meter-label">MASTER</span>
                    <input type="range" id="master-volume-slider" class="master-volume-slider"
                           min="0" max="100" value="91" step="1"
                           title="Master Volume">
                    <span class="master-volume-readout" id="master-volume-readout">-3.6 dB</span>
                    <div class="master-meter-container">
                        <canvas id="master-meter-canvas" width="140" height="8"></canvas>
                    </div>
                    <span class="limiter-label">LIMITER -2.6dB</span>
                </div>

                <div class="transport-spacer"></div>
                <div class="render-loops-group">
                    <label class="render-loops-label" for="render-loops-input">Loops to Render</label>
                    <input class="render-loops-input" id="render-loops-input" type="number" min="1" max="999" value="1" step="1">
                </div>
                <div class="render-loops-group" style="margin-left: 8px;">
                    <label class="render-loops-label" for="render-format-select">Format</label>
                    <select id="render-format-select" class="render-format-select">
                        <option value="wav">WAV</option>
                        <option value="mp3">MP3</option>
                        <option value="ogg">OGG</option>
                    </select>
                </div>
                <button class="btn-render-mix" id="btn-render-mix" type="button" disabled title="Render Mix">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Render Mix
                </button>
                <button class="btn-export-loops" id="btn-export-loops" type="button" disabled title="Export all playing loops as ZIP">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Export Loops
                </button>
                <button class="btn-undo" id="btn-undo" type="button" title="Undo last action" style="display:none;">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>Undo
                </button>
                <label class="toggle-switch" title="Click waveform to seek playhead">
                    <input type="checkbox" id="toggle-seek">
                    <span class="toggle-track"></span>Seek
                </label>
                <label class="toggle-switch" title="Split cards: left = queue at loop start, right = instant switch">
                    <input type="checkbox" id="toggle-split">
                    <span class="toggle-track"></span>Split
                </label>
            </div>

            <!-- Visualizer Tray -->
            <div class="visualizer-tray" id="visualizer-tray">
                <canvas class="viz-canvas" id="viz-spectrum" title="Spectrum Analyzer"></canvas>
                <canvas class="viz-canvas" id="viz-oscilloscope" title="Oscilloscope"></canvas>
                <canvas class="viz-canvas viz-meters" id="viz-meters" title="Peak Meters"></canvas>
            </div>
        </div>

        <!-- Track Rows -->
        <div class="tracks-container empty" id="tracks-container">
            <div class="grid-empty-state">
                <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
                <div>Enter a prompt and hit <strong>Generate</strong></div>
            </div>
        </div>

    </div>

    <script src="/static/app.js"></script>
</body>
</html>
