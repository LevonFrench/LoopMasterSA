<!DOCTYPE html>
<html>
<head>
    <title>Loading Backend</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        .loader {
            border: 6px solid #333;
            border-top: 6px solid #bb86fc;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #bb86fc;
            margin: 0;
        }
        p {
            color: #aaaaaa;
        }
        .stop-button {
            margin-top: 14px;
            padding: 9px 16px;
            color: #ddd;
            background: transparent;
            border: 1px solid #666;
            border-radius: 6px;
            cursor: pointer;
        }
        .stop-button:hover {
            border-color: #bb86fc;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Loading Audio Engine...</h2>
    <p>Loading model weights and allocating VRAM. A first download can take several minutes; later starts use the local cache.</p>
    <button class="stop-button" onclick="window.electronAPI.stopBackend()">Stop startup</button>
</body>
</html>
