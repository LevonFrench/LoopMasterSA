<!DOCTYPE html>
<html>
<head>
    <title>LoopMaster SA3 Launcher</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            color: #bb86fc;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: #333333;
            color: white;
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .btn:hover {
            background-color: #444444;
            border-color: #bb86fc;
        }
        .btn-title {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .btn-desc {
            font-size: 13px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LoopMaster Launcher</h1>
        <p style="text-align:center; color:#ccc; margin-bottom: 30px;">Select a PyTorch inference model to boot.</p>
        
        <button class="btn" onclick="window.electronAPI.startBackend('1')">
            <span class="btn-title">Medium Model (Default)</span>
            <span class="btn-desc">Official - FP32 Precision, High VRAM, GPU</span>
        </button>
        <button class="btn" onclick="window.electronAPI.startBackend('2')">
            <span class="btn-title">Small Music Model</span>
            <span class="btn-desc">Lightweight, CPU/GPU compatible</span>
        </button>
        <button class="btn" onclick="window.electronAPI.startBackend('3')">
            <span class="btn-title">Small SFX Model</span>
            <span class="btn-desc">Optimized for Sound Effects</span>
        </button>
        <button class="btn" onclick="window.electronAPI.startBackend('4')">
            <span class="btn-title">Medium Model (BF16)</span>
            <span class="btn-desc">Optimized - BF16 Precision, Low VRAM, GPU</span>
        </button>
    </div>
</body>
</html>
