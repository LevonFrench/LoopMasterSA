<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoopMaster SA3 — Grid Generator</title>
    <meta name="description" content="Multi-track audio variant generator with synchronized grid playback.">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="app-logo">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6Z"/></svg>
            </div>
            <h1 class="app-title">LoopMaster SA3 <span>Grid Generator</span></h1>
        </header>

        <!-- Controls -->
        <section class="controls-panel" id="controls-panel">
            <div class="controls-row">
                <div class="control-group prompt-group">
                    <label class="control-label" for="prompt-input">Prompt</label>
                    <div class="prompt-input-wrapper">
                        <input class="control-input" id="prompt-input" type="text"
                               placeholder="bass synth loop, funky, hyperpop…"
                               autocomplete="off" spellcheck="false">
                        <div class="prompt-inline-btns">
                            <button class="prompt-pill-btn" id="btn-random-prompt" type="button" title="Generate Random Instrument Prompt">🎲 Random</button>
                            <button class="prompt-pill-btn" id="btn-random-in-key" type="button" title="Generate Random Prompt in Current Key/Chord">🔑 In Key</button>
                            <button class="prompt-pill-btn" id="btn-random-drums" type="button" title="Generate Random Drum Loop Prompt">🥁 Drums</button>
                            <button class="prompt-pill-btn" id="btn-random-bass" type="button" title="Generate Random Bass Prompt">🎸 Bass</button>
                            <button class="prompt-pill-btn" id="btn-random-lead" type="button" title="Generate Random Lead Prompt">🎹 Lead</button>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label" for="bpm-input" title="Tempo in beats per minute. Determines loop length (4 bars). Drag to change, double-click to type.">BPM</label>
                    <input class="control-input" id="bpm-input" type="number"
                           min="40" max="300" value="120" step="1"
                           title="Click to type, drag ↕ to change. 120 BPM = 8s loop (4 bars)">
                </div>

                <div class="control-group">
                    <label class="control-label" for="seed-input" title="Random seed for reproducible generations. -1 = random each time. Set a number to get the same output.">Seed</label>
                    <input class="control-input control-input-sm" id="seed-input" type="number"
                           min="-1" max="999999" value="-1" step="1"
                           title="Click to type, drag ↕ to change. -1 = random">
                </div>

                <div class="control-group">
                    <label class="control-label" for="cfg-input" title="Classifier-Free Guidance. 1.0 = creative/varied, 3-5 = balanced, 7-15 = strict prompt adherence.">CFG</label>
                    <input class="control-input control-input-sm" id="cfg-input" type="number"
                           min="0.5" max="15" value="1.0" step="0.5"
                           title="Click to type, drag ↕ to change. Low = creative, High = strict">
                </div>

                <div class="control-group">
                    <label class="control-label" for="steps-input" title="Diffusion denoising passes. 8 = fast iteration, 20-30 = high quality, 50+ = diminishing returns.">Steps</label>
                    <input class="control-input control-input-sm" id="steps-input" type="number"
                           min="1" max="100" value="8" step="1"
                           title="Click to type, drag ↕ to change. More = better but slower">
                </div>

                <div class="control-group">
                    <button class="btn-generate" id="btn-generate" type="button">Generate</button>
                </div>
            </div>

            <div class="status-bar" id="status-bar">
                <div class="status-spinner"></div>
                <span class="status-text" id="status-text">Generating…</span>
            </div>

            <!-- Init Audio Badge -->
            <div class="init-audio-badge" id="init-audio-badge" style="display: none;">
                <span><svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z"/></svg>Using Init Audio: <strong id="init-audio-name">None</strong></span>
                <div class="init-noise-control">
                    <label for="init-noise-slider">Noise:</label>
                    <input type="range" id="init-noise-slider" min="10" max="90" value="60" step="5">
                    <span id="init-noise-value">0.60</span>
                </div>
                <button class="btn-clear-init" id="btn-clear-init" type="button" title="Clear Init Audio">×</button>
            </div>
        </section>

        <!-- Transport Panel -->
        <div class="transport-panel">
            <div class="transport-bar" id="transport-bar">
                <button class="btn-transport" id="btn-play-pause" type="button" disabled aria-label="Play">
                    <svg class="ic ic-play" viewBox="0 0 16 16"><path d="M4 2.5l9 5.5-9 5.5z"/></svg>
                    <svg class="ic ic-pause" viewBox="0 0 16 16"><rect x="3.5" y="2" width="3" height="12" rx="0.5"/><rect x="9.5" y="2" width="3" height="12" rx="0.5"/></svg>
                </button>
                <span class="transport-time">
                    <span id="t-position">0:00.0</span> / <span id="t-duration">0:00.0</span>
                </span>
                
                <!-- Master Meter & Limiter Section -->
                <div class="master-meter-section" id="master-meter-section" style="display: none;">
                    <span class="master-meter-label">MASTER</span>
                    <div class="master-meter-container">
                        <canvas id="master-meter-canvas" width="140" height="8"></canvas>
                    </div>
                    <span class="limiter-label">LIMITER -11dB</span>
                </div>

                <div class="transport-spacer"></div>
                <div class="render-loops-group">
                    <label class="render-loops-label" for="render-loops-input">Loops to Render</label>
                    <input class="render-loops-input" id="render-loops-input" type="number" min="1" max="999" value="1" step="1">
                </div>
                <button class="btn-render-mix" id="btn-render-mix" type="button" disabled title="Render Mix to WAV">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Render Mix
                </button>
                <button class="btn-export-loops" id="btn-export-loops" type="button" disabled title="Export all playing loops as ZIP">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Export Loops
                </button>
                <button class="btn-undo" id="btn-undo" type="button" title="Undo last action" style="display:none;">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>Undo
                </button>
                <label class="toggle-switch" title="Click waveform to seek playhead">
                    <input type="checkbox" id="toggle-seek">
                    <span class="toggle-track"></span>Seek
                </label>
            </div>

            <!-- Visualizer Tray -->
            <div class="visualizer-tray" id="visualizer-tray">
                <canvas class="viz-canvas" id="viz-spectrum" title="Spectrum Analyzer"></canvas>
                <canvas class="viz-canvas" id="viz-oscilloscope" title="Oscilloscope"></canvas>
                <canvas class="viz-canvas viz-meters" id="viz-meters" title="Peak Meters"></canvas>
            </div>
        </div>

        <!-- Track Rows -->
        <div class="tracks-container empty" id="tracks-container">
            <div class="grid-empty-state">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6Z"/></svg>
                <div>Enter a prompt and hit <strong>Generate</strong></div>

                <div class="guide-visual">
                    <div class="guide-section">
                        <div class="guide-heading">Clip Switching</div>
                        <div class="guide-card-demo">
                            <div class="guide-card-zone zone-queue">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 8 14"/></svg>
                                <span>Queue</span>
                                <em>waits for loop</em>
                            </div>
                            <div class="guide-card-split"></div>
                            <div class="guide-card-zone zone-instant">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <span>Instant</span>
                                <em>switches now</em>
                            </div>
                        </div>
                    </div>

                    <div class="guide-tips">
                        <div class="guide-tip">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><polyline points="8 6 12 2 16 6"/><polyline points="8 18 12 22 16 18"/></svg>
                            <span>Drag numbers to change</span>
                        </div>
                        <div class="guide-tip">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
                            <span>Click numbers to type</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="/static/app.js"></script>
</body>
</html>
